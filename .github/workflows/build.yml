name: Build PMIC firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RTT_REPO: https://github.com/RT-Thread/rt-thread.git
  RTT_REF: v5.3.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Fix workspace permissions
        if: runner.environment == 'self-hosted'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib \
            unzip p7zip-full python3

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            thirdparty/rt-thread
            thirdparty/GD32F50x_Firmware_Library_V1.0.3
            thirdparty/STM32F1xx_CMSIS
          key: pmic-deps-${{ runner.os }}-${{ env.RTT_REF }}-${{ hashFiles('scripts/extract_stm32_cmsis.sh', 'thirdparty/GD32F50x_Firmware_Library_V1.0.3.7z', 'thirdparty/STM32CubeF1-v1.8.7.zip', 'thirdparty/cmsis_device_f1-v4.3.5.zip') }}

      - name: Prepare dependencies
        run: |
          set -euo pipefail
          if [ ! -f thirdparty/rt-thread/src/scheduler_up.c ] || \
             [ "$(git -C thirdparty/rt-thread describe --tags --always 2>/dev/null)" != "$RTT_REF" ]; then
            rm -rf thirdparty/rt-thread
            git clone --depth 1 --branch "$RTT_REF" "$RTT_REPO" thirdparty/rt-thread
          fi
          if [ ! -d thirdparty/GD32F50x_Firmware_Library_V1.0.3/Firmware ]; then
            7z x -y -othirdparty thirdparty/GD32F50x_Firmware_Library_V1.0.3.7z >/dev/null
          fi
          if [ ! -f thirdparty/STM32F1xx_CMSIS/VERSION ]; then
            ./scripts/extract_stm32_cmsis.sh
          fi

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            thirdparty/rt-thread
            thirdparty/GD32F50x_Firmware_Library_V1.0.3
            thirdparty/STM32F1xx_CMSIS
          key: pmic-deps-${{ runner.os }}-${{ env.RTT_REF }}-${{ hashFiles('scripts/extract_stm32_cmsis.sh', 'thirdparty/GD32F50x_Firmware_Library_V1.0.3.7z', 'thirdparty/STM32CubeF1-v1.8.7.zip', 'thirdparty/cmsis_device_f1-v4.3.5.zip') }}

      - name: Build STM32F103 bootloader
        run: |
          set -euo pipefail
          B=build-ci
          cmake -S boards/stm32f103_pmic/bootloader -B "$B/boot-stm32f103c8" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$B/boot-stm32f103c8" -j"$(nproc)"

      - name: Test STM32 serial OTA protocol
        run: python3 -m unittest discover -s boards/stm32f103_pmic/tests -p test_stm32_serial_ota.py

      - name: Build STM32F103 application
        run: |
          set -euo pipefail
          B=build-ci
          TC="$PWD/boards/stm32f103_pmic/cmake/gcc-arm-none-eabi.cmake"
          cmake -S boards/stm32f103_pmic -B "$B/app-stm32f103c8" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TC" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$B/app-stm32f103c8" -j"$(nproc)"
          strings "$B/app-stm32f103c8/ChargeBAT.bin" | grep -Fxq '0.1.10'
          strings "$B/app-stm32f103c8/ChargeBAT.bin" | grep -Fq 'CHG_FAULT:%u;'

      - name: Build GD32F503 bootloader
        run: |
          set -euo pipefail
          cmake -S boards/gd32f503_pmic/bootloader -B build-ci/boot-gd32f503 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci/boot-gd32f503 -j"$(nproc)"

      - name: Build GD32F503 application
        run: |
          set -euo pipefail
          TC="$PWD/boards/gd32f503_pmic/cmake/gcc-arm-none-eabi.cmake"
          cmake -S boards/gd32f503_pmic -B build-ci/app-gd32f503 -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TC" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci/app-gd32f503 -j"$(nproc)"
          strings build-ci/app-gd32f503/ChargeBAT_GD32.bin | grep -Fxq '0.1.1-gd32'
          strings build-ci/app-gd32f503/ChargeBAT_GD32.bin | grep -Fq 'CHG_FAULT:%u;'
          ! strings build-ci/app-gd32f503/ChargeBAT_GD32.bin | grep -Fxq '0.1.10'

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/stm32f103c8
          cp build-ci/boot-stm32f103c8/boot.bin build-ci/boot-stm32f103c8/boot.hex dist/stm32f103c8/
          cp build-ci/app-stm32f103c8/ChargeBAT.bin build-ci/app-stm32f103c8/ChargeBAT.hex dist/stm32f103c8/
          (cd dist/stm32f103c8 && sha256sum boot.bin boot.hex ChargeBAT.bin ChargeBAT.hex > SHA256SUMS)
          tar -C dist/stm32f103c8 -czf dist/stm32f103c8_firmware.tar.gz .
          mkdir -p dist/gd32f503
          cp build-ci/boot-gd32f503/boot.bin build-ci/boot-gd32f503/boot.hex dist/gd32f503/
          cp build-ci/app-gd32f503/ChargeBAT_GD32.bin build-ci/app-gd32f503/ChargeBAT_GD32.hex dist/gd32f503/
          (cd dist/gd32f503 && sha256sum boot.bin boot.hex ChargeBAT_GD32.bin ChargeBAT_GD32.hex > SHA256SUMS)
          tar -C dist/gd32f503 -czf dist/gd32f503_firmware.tar.gz .
          test "$(find dist -maxdepth 1 -name '*_firmware.tar.gz' | wc -l)" -eq 2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pmic-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.GD32_HARDWARE_VERIFIED == 'true'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: pmic-firmware
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stm32f103c8_firmware.tar.gz
            dist/gd32f503_firmware.tar.gz
          generate_release_notes: true
